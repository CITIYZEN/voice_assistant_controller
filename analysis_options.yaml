# Includes the official Flutter recommended linting rule set.
include: package:flutter_lints/flutter.yaml

# Customizes analyzer settings for the Dart compiler and linter.
analyzer:
   # Instructs analyzer to ignore warnings and deprecation notices across different Flutter SDK versions.
  errors:
    # Ignores deprecation warnings to maintain backward and forward compatibility.
    deprecated_member_use: ignore
    # Ignores unused imports.
    unused_import: ignore
    # Ignores TODO comment warnings.
    todo: ignore
  exclude:
    - build/**
    - android/**

# Customizes specific linter rules for clean and readable code structure.
linter:
  rules:
    # Requires prefer_const_constructors where possible for maximum rendering performance.
    prefer_const_constructors: true
    # Encourages meaningful variable names and clean control flow.
    avoid_empty_else: true
