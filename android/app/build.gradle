// Applies the Android application plugin for building APK and App Bundle packages
plugins {
    // Identifies this module as an Android Application
    id "com.android.application"
    // Enables Kotlin language support for Android components
    id "kotlin-android"
    // Applies Flutter Gradle integration plugin
    id "dev.flutter.flutter-gradle-plugin"
}

// Configures Android application compile parameters and packaging options
android {
    // Sets package namespace matching package declaration in AndroidManifest
    namespace = "com.citiyzen.voice_assistant_controller"
    // Targets latest stable Android SDK API level 34 (Android 14) for maximum compatibility
    compileSdk = 34

    // Configures Java compatibility targets for source code compilation
    compileOptions {
        // Sets Java source compatibility to Java 8
        sourceCompatibility = JavaVersion.VERSION_1_8
        // Sets Java target bytecode compatibility to Java 8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    // Configures Kotlin JVM compiler options
    kotlinOptions {
        // Emits JVM 1.8 compatible bytecode
        jvmTarget = "1.8"
    }

    // Default configuration values for all build variants
    defaultConfig {
        // Sets unique application identifier on Android devices and Google Play Store
        applicationId = "com.citiyzen.voice_assistant_controller"
        // Minimum SDK set to API 21 (Android 5.0 Lollipop) ensuring 99%+ device compatibility
        minSdk = 21
        // Targets API 34 ensuring compliance with current Android runtime requirements
        targetSdk = 34
        // Sets internal build version code as an incrementing integer
        versionCode = 1
        // Sets user-visible release version string
        versionName = "1.0.0"
    }

    // Configures build release signing and obfuscation options
    buildTypes {
        // Settings for production release builds
        release {
            // Uses standard debug signing config by default so release APK builds immediately without custom keystore setup
            signingConfig = signingConfigs.debug
            // Disables code shrinking for rapid compilation and avoiding reflection issues
            minifyEnabled = false
            // Disables resource shrinking during initial builds
            shrinkResources = false
        }
    }
}

// Configures dependencies required by the Android application module
dependencies {
    // Core Kotlin standard library dependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
}
