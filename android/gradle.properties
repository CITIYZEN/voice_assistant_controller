# Allocates maximum heap size and garbage collection settings for Gradle build daemon
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
# Enables modern AndroidX libraries instead of legacy Android Support libraries
android.useAndroidX=true
# Automatically enables Jetifier tool to migrate third-party binary libraries to AndroidX
android.enableJetifier=true
# Disables Kotlin incremental compilation to prevent Windows file locking conflicts
kotlin.incremental=false
kotlin.incremental.java=false
# Disables Kotlin incremental compilation to prevent Windows file locking conflicts
kotlin.incremental=false
kotlin.incremental.java=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
