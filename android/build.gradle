// Root-level build configuration across all subprojects and modules
allprojects {
    // Configures remote artifact repositories for resolving build dependencies
    repositories {
        // Google Maven repository for AndroidX and Android support artifacts
        google()
        // Maven Central repository for open-source Java/Kotlin packages
        mavenCentral()
    }
}

// Configures the buildscript classpath for the Gradle root project
buildscript {
    // Defines repositories to locate Gradle build plugins
    repositories {
        // Google Maven repository
        google()
        // Maven Central repository
        mavenCentral()
    }

    // Declares required Gradle plugins and build dependencies
    dependencies {
        // Android Gradle Plugin version compatible with modern Flutter tooling
        classpath 'com.android.tools.build:gradle:8.2.1'
        // Kotlin Gradle Plugin for compiling Kotlin Android sources
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

// Custom build output redirect for Flutter project builds
rootProject.buildDir = '../build'
subprojects {
    // Routes each subproject's build output into root build directory
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // Ensures app module evaluation completes first
    project.evaluationDependsOn(':app')
}

// Clean task to delete the build directory during flutter clean
tasks.register("clean", Delete) {
    // Deletes the root build directory
    delete rootProject.buildDir
}
